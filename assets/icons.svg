<?xml version="1.0" encoding="UTF-8"?>
<!--
  Спрайт иконок FATLOSS·CALC.

  Использование в разметке:
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#i-check"/>
    </svg>

  Заливочные иконки (drag, play, pause) используются с fill="currentColor" stroke="none".

  ВАЖНО: в symbol намеренно нет презентационных атрибутов (fill, stroke,
  stroke-width). Атрибут stroke-width внутри symbol ПЕРЕБИВАЕТ значение с
  хост-<svg>, поэтому разные толщины линий (1.9 … 3.4) перестали бы работать.
  Вся презентация задаётся на <svg> в месте использования.

  Внешний спрайт (<use href="assets/icons.svg#i-check">) не используется:
  на file:// он блокируется CORS, а страница должна открываться с диска.
  Содержимое файла встраивается в документ скриптом assets/common.app.js.
  Подробности — в agents.md.
-->
